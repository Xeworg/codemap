name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.23"

jobs:
  # Fast feedback: compile + unit tests, no overhead.
  fast:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./cmd/codemap

  # Detect data races and unsafe concurrent access patterns.
  race:
    name: Race Detector
    runs-on: ubuntu-latest
    # Skip on merge to main to save CI time; race is primarily a PR safety gate.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Race tests (codemap packages only)
        run: go test -race -count=1 ./packages/coding-agent/codemap/...

  # Lint: static analysis + style checks via golangci-lint.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci-lint/golangci-lint-action@v6
        with:
          version: "v2"
          # Run only on codemap packages to stay fast.
          args: --timeout=5m ./packages/coding-agent/codemap/...
